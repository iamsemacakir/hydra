# Hydra login theme for Keycloak 26.6.3.
# Keycloak's own keycloak.v2 theme with Hydra's page frame (template.ftl), colours and type (css/hydra.css).
# Everything not set here is inherited from keycloak.v2. See docs/authentication.md, "Login theme".
parent=keycloak.v2
import=common/keycloak

# keycloak.v2's stylesheet first, Hydra's on top of it.
styles=css/styles.css css/hydra.css
